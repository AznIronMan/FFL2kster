name: Platforms

# Installable builds of the port for the six targets: web (PWA), Windows, macOS, Linux (Tauri 2),
# Android and iOS (Capacitor 8). Every build ships engine code only; game data is imported from
# the player's own ROM at run time. Artifacts are attached to the run (nothing is published).
#
# Signing is optional and turns on when the repository has the secrets:
#   macOS sign + notarize: APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD,
#     APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD (app-specific), APPLE_TEAM_ID
# Without them the desktop builds are unsigned, the Android APK is debug-signed (sideloadable)
# and the iOS builds are unsigned (simulator app; device app needs signing to install).
on:
  push:
    branches: [main]
    paths: ["port/**", ".github/workflows/platforms.yml"]
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: port } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: port/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npm run build -w @ffl2k/web
      - run: node scripts/check-no-content.mjs apps/web/dist
      - uses: actions/upload-artifact@v4
        with: { name: fftol-web-pwa, path: port/apps/web/dist, if-no-files-found: error }

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, args: "--target universal-apple-darwin", name: macos }
          - { os: windows-latest, args: "", name: windows }
          - { os: ubuntu-22.04, args: "", name: linux }
    runs-on: ${{ matrix.os }}
    env:
      HAS_APPLE: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: port/package-lock.json }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "port/apps/desktop/src-tauri -> target" }
      - if: matrix.name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci --no-audit --no-fund
        working-directory: port
      - run: npm run build -w @ffl2k/web
        working-directory: port
      - name: Build (unsigned)
        if: matrix.name != 'macos' || env.HAS_APPLE != 'true'
        working-directory: port/apps/desktop
        run: npx tauri build ${{ matrix.args }}
      - name: Build (signed and notarized)
        if: matrix.name == 'macos' && env.HAS_APPLE == 'true'
        working-directory: port/apps/desktop
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx tauri build ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: fftol-desktop-${{ matrix.name }}
          if-no-files-found: error
          path: |
            port/apps/desktop/src-tauri/target/**/release/bundle/dmg/*.dmg
            port/apps/desktop/src-tauri/target/**/release/bundle/msi/*.msi
            port/apps/desktop/src-tauri/target/**/release/bundle/nsis/*.exe
            port/apps/desktop/src-tauri/target/**/release/bundle/deb/*.deb
            port/apps/desktop/src-tauri/target/**/release/bundle/rpm/*.rpm
            port/apps/desktop/src-tauri/target/**/release/bundle/appimage/*.AppImage

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: port/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci --no-audit --no-fund
        working-directory: port
      - run: npm run build -w @ffl2k/web
        working-directory: port
      - run: npx cap sync android && cd android && ./gradlew assembleDebug --no-daemon
        working-directory: port/apps/mobile
      - uses: actions/upload-artifact@v4
        with: { name: fftol-android-apk, path: port/apps/mobile/android/app/build/outputs/apk/debug/*.apk, if-no-files-found: error }

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: port/package-lock.json }
      - run: npm ci --no-audit --no-fund
        working-directory: port
      - run: npm run build -w @ffl2k/web
        working-directory: port
      - run: npx cap sync ios
        working-directory: port/apps/mobile
      - name: Simulator app and unsigned device app
        working-directory: port/apps/mobile/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -sdk iphonesimulator -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          mkdir -p out/Payload
          cp -R build/Build/Products/Release-iphoneos/App.app out/Payload/
          (cd out && zip -qr TowerOfLegends-unsigned.ipa Payload)
          (cd build/Build/Products/Release-iphonesimulator && zip -qr ../../../../out/TowerOfLegends-simulator.zip App.app)
      - uses: actions/upload-artifact@v4
        with: { name: fftol-ios, path: "port/apps/mobile/ios/App/out/*.ipa\nport/apps/mobile/ios/App/out/*.zip", if-no-files-found: error }
