name: Release (private draft)

# A version tag (v1.2.3) builds every target (platforms.yml) and attaches the web, Windows,
# macOS and Linux builds to a DRAFT GitHub release. Drafts are visible only to people with write
# access to the repository; nothing is published unless the owner publishes the draft.
# Android and iOS are built by platforms.yml too but are deferred targets and not attached.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/platforms.yml
    secrets: inherit

  draft:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Collect files
        run: |
          mkdir -p out
          (cd artifacts/fftol-web-pwa && zip -qr "../../out/TowerOfLegends-${GITHUB_REF_NAME}-web.zip" .)
          find artifacts/fftol-desktop-* -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) -exec cp {} out/ \;
          ls -la out
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --draft \
            --title "Tower of Legends $GITHUB_REF_NAME (private build)" \
            --notes "Private build. Ships no game content: import your own ROM on first start. Install notes: docs/INSTALL.md. Targets: web (static files), Windows (.msi / setup .exe), macOS (.dmg), Linux (.deb / .rpm / .AppImage). Unsigned builds: see docs/INSTALL.md for the first-start prompts."
