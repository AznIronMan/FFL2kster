name: Release (private draft)

# A version tag (v1.2.3) builds every target (platforms.yml) and attaches the web, Windows,
# macOS and Linux builds (under plain names, port/scripts/stage-installers.sh) to a DRAFT GitHub
# release. Drafts are visible only to people with write access to the repository; nothing is
# published unless the owner publishes the draft. Android and iOS are built by platforms.yml
# too but are deferred targets and not attached.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/platforms.yml
    secrets: inherit

  draft:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Collect files
        run: |
          mkdir -p out
          (cd artifacts/fftol-web-pwa && zip -qr "../../out/TowerOfLegends-${GITHUB_REF_NAME#v}-web.zip" .)
          cp artifacts/fftol-desktop-*/* out/
          ls -la out
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --draft \
            --title "Tower of Legends $GITHUB_REF_NAME (private build)" \
            --notes "Private build of Tower of Legends: Legend I, II and III. Ships no game content: import your own ROMs on first start. Pick one file for your system: Windows: -windows-setup.exe (installer) or -windows-portable.exe (no install); macOS: -macos.dmg (drag to Applications) or -macos-app.zip (unzip and run); Linux: -linux-x86_64.AppImage (chmod +x and run), -linux-amd64.deb or -linux-x86_64.rpm; any browser: -web.zip. The builds are not code-signed: see docs/INSTALL.md for the first-start prompts."
