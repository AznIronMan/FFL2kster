[package]
name = "fftol"
version = "1.3.0"
description = "Tower of Legends (FFTOL) desktop shell. Ships no game content."
edition = "2021"
publish = false

[lib]
name = "fftol_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
