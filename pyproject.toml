[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ffl2kster"
version = "1.58.1"
description = "FFL2kster, the Legend II toolkit of FFTOL (Tower of Legends): local editor and patch compiler for Final Fantasy Legend II (USA) on Game Boy"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
emu = ["pyboy>=2.8", "numpy", "pillow"]
dev = ["pytest>=7", "pyboy>=2.8", "numpy", "pillow"]

[project.scripts]
ffl2kster = "ffl2kster.cli:main"
ffl1kster = "ffl1kster.cli:main"
ffl3kster = "ffl3kster.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
markers = ["emu: requires PyBoy emulator and save states (slow)"]
